sonar.projectKey=python-metrics-system-backend
sonar.projectName=python-metrics-system-backend
sonar.projectVersion=1.0

# Codigo fuente Python del proyecto
sonar.sources=analisis,audit,config,usuarios
sonar.sourceEncoding=UTF-8

# Analizar solo archivos Python
sonar.inclusions=**/*.py

# Excluir artefactos no relevantes
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/venv/**,**/env/**,**/*.pyc,**/node_modules/**,**/static/**

